version: "3"
name: codimd
services:
  database:
    image: postgres:11.6-alpine
    container_name: codimd-db
    environment:
      - POSTGRES_USER=codimd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=codimd
    volumes:
      - ${ROOT_PATH}/database:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - codimd

  codimd:
    image: hackmdio/hackmd:latest
    container_name: codimd-app
    deploy:
      resources:
        reservations:
          memory: 128M
    environment:
      - CMD_DB_URL=postgres://codimd:${POSTGRES_PASSWORD}@database/codimd
      - CMD_USECDN=false
    depends_on:
      - database
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ${ROOT_PATH}/uploads:/home/hackmd/app/public/uploads
    restart: unless-stopped
    networks:
      - codimd

networks:
  codimd:
    name: codimd
